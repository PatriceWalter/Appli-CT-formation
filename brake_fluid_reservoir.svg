<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="50" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#163b68">Liquide de frein — réservoir et contrôle</text>
<text x="50" y="110" font-family="Arial" font-size="20" fill="#506070">Repérage du réservoir et niveaux mini / maxi</text>
<rect x="90" y="160" width="1020" height="560" rx="24" fill="#fbfcfe" stroke="#d6e0ea" stroke-width="2"/>
<rect x="420" y="250" width="250" height="290" rx="24" fill="#f8fbff" stroke="#7f9bbd" stroke-width="4"/>
<rect x="465" y="195" width="160" height="70" rx="18" fill="#111827"/>
<rect x="445" y="365" width="200" height="145" fill="#f8d88a" opacity="0.85"/>
<line x1="430" y1="325" x2="665" y2="325" stroke="#1d4f91" stroke-width="4" stroke-dasharray="10 8"/>
<line x1="430" y1="530" x2="665" y2="530" stroke="#cf7d14" stroke-width="4" stroke-dasharray="10 8"/>
<text x="698" y="330" font-family="Arial" font-size="26" font-weight="700" fill="#1d4f91">MAX</text>
<text x="698" y="535" font-family="Arial" font-size="26" font-weight="700" fill="#cf7d14">MIN</text>
<text x="160" y="300" font-family="Arial" font-size="24" fill="#333">Le réservoir de liquide de frein est généralement fixé au-dessus du maître-cylindre.</text>
<text x="160" y="350" font-family="Arial" font-size="24" fill="#333">Vérifier : niveau, fuite, bouchon, pollution apparente du liquide et témoins associés.</text>
