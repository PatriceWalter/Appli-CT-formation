<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#fff"/>
<text x="50" y="65" font-family="Arial" font-size="34" font-weight="700" fill="#153b68">Catégorie L — commandes de frein</text>
<text x="50" y="105" font-family="Arial" font-size="20" fill="#566579">Levier au guidon et/ou pédale selon architecture du véhicule</text>
<rect x="70" y="160" width="500" height="500" rx="22" fill="#fbfcfe" stroke="#d7e0e9" stroke-width="2"/>
<text x="100" y="205" font-family="Arial" font-size="25" font-weight="700" fill="#153b68">Commande au guidon</text>
<line x1="180" y1="370" x2="470" y2="370" stroke="#26384b" stroke-width="24" stroke-linecap="round"/>
<rect x="350" y="325" width="100" height="90" rx="16" fill="#dfe8f2" stroke="#6f88a2" stroke-width="3"/>
<path d="M350 348 Q245 280 180 335" fill="none" stroke="#cf7d14" stroke-width="14" stroke-linecap="round"/>
<text x="115" y="490" font-family="Arial" font-size="22" fill="#333">Levier : articulation, course, retour, fixation et fonctionnement.</text>
<rect x="630" y="160" width="500" height="500" rx="22" fill="#fbfcfe" stroke="#d7e0e9" stroke-width="2"/>
<text x="660" y="205" font-family="Arial" font-size="25" font-weight="700" fill="#153b68">Commande au pied</text>
<path d="M765 340 L940 430" fill="none" stroke="#26384b" stroke-width="18" stroke-linecap="round"/>
<circle cx="755" cy="335" r="24" fill="#54789f"/>
<rect x="930" y="400" width="110" height="48" rx="10" fill="#cf7d14"/>
<path d="M755 335 L720 250" fill="none" stroke="#54789f" stroke-width="14"/>
<text x="690" y="510" font-family="Arial" font-size="22" fill="#333">Pédale : pivot, course, retour, fixation et liaison vers le frein.</text>
<rect x="90" y="680" width="1020" height="44" rx="12" fill="#eef6ff" stroke="#bfd2ec"/>
<text x="115" y="709" font-family="Arial" font-size="20" fill="#153b68">Ne pas assimiler systématiquement une moto à une pédale de frein automobile : les commandes varient selon catégorie et conception.</text>
</svg>